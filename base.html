<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJP Cinema</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        h1, h2 { color: #ffcc00; }
        .btn { background: #ffcc00; color: #000; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; margin: 5px; font-weight: bold; }
        .btn:hover { background: #ffaa00; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        .seat { display: inline-block; width: 28px; height: 28px; margin: 2px; text-align: center; line-height: 28px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .available { background: #2a2a2a; border: 1px solid #555; }
        .booked { background: #c0392b; color: white; cursor: not-allowed; }
        .selected { background: #ffcc00; color: #000; }
        .screen { background: #333; text-align: center; padding: 12px; margin-bottom: 20px; border-radius: 5px; letter-spacing: 3px; }
        .flash { background: #ff4444; padding: 12px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 TJP CINEMA</h1>
        <a href="{{ url_for('index') }}" class="btn">Home</a>
        <a href="{{ url_for('view_bookings') }}" class="btn">View Bookings</a>
        <a href="{{ url_for('scan') }}" class="btn">Scan Ticket</a>
        <hr style="border-color:#333; margin: 20px 0;">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
