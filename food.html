{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Food & Beverages</h2>
    <p>Select items (leave 0 if you don't want any)</p>

    <form method="POST">
        <table>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
            {% for key, item in menu.items() %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>Rs. {{ item[1] }}</td>
                <td>
                    <input type="number" name="qty_{{ key }}" value="0" min="0" max="20" style="width:70px; padding:6px;">
                </td>
            </tr>
            {% endfor %}
        </table>
        <br>
        <button type="submit" class="btn">Confirm Booking</button>
    </form>
</div>
{% endblock %}
