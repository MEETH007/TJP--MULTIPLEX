<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TJP Cinema — Premium Movie Experience{% endblock %}</title>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-hover: #e6b800;
            --bg-body: linear-gradient(135deg, #090814 0%, #15122b 50%, #0e0d1f 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --chip-bg: rgba(255, 204, 0, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --input-bg: rgba(0, 0, 0, 0.4);
            --success: #2ecc71;
            --danger: #e74c3c;
            --screen-glow: rgba(255, 204, 0, 0.4);
            --radius-lg: 16px;
            --radius-sm: 8px;
        }

        /* Clean Luxury Light Mode */
        body.light-mode {
            --primary: #b45309;
            --primary-hover: #92400e;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --chip-bg: #fef3c7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f1f5f9;
            --screen-glow: rgba(180, 83, 9, 0.3);
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-body);
            color: var(--text-main); 
            min-height: 100vh;
            padding: 24px 16px;
            line-height: 1.5;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .container { max-width: 1080px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 24px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .logo {
            font-size: clamp(26px, 5vw, 38px);
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1.5px;
            text-decoration: none;
            display: inline-block;
        }
        .tagline {
            color: var(--text-muted);
            margin-top: 4px;
            font-size: 0.9rem;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn { 
            background: var(--primary);
            color: #000; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        body.light-mode .btn { color: #fff; }
        .btn:hover { 
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--card-bg);
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .card { 
            background: var(--card-bg); 
            padding: clamp(20px, 4vw, 32px); 
            border-radius: var(--radius-lg); 
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .flash { 
            background: rgba(231, 76, 60, 0.15); 
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 12px 20px; 
            border-radius: var(--radius-sm); 
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        input[type="text"], input[type="email"], input[type="number"], input[type="password"] {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ url_for('index') }}" class="logo">🎬 TJP CINEMA</a>
            <p class="tagline">Next-Gen Cinema Reservation Portal</p>
        </header>

        <nav class="nav-bar">
            <a href="{{ url_for('index') }}" class="btn btn-outline">Home</a>
            <a href="{{ url_for('view_bookings') }}" class="btn btn-outline">Admin Panel</a>
            <a href="{{ url_for('scan') }}" class="btn btn-outline">Gate Scanner</a>
            <a href="{{ url_for('admin_reset') }}" class="btn btn-outline" style="color: var(--danger);">Reset Bookings</a>
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
        </nav>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function applySavedTheme() {
            const savedTheme = localStorage.getItem('tjp_theme');
            const themeBtn = document.getElementById('themeBtn');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                themeBtn.textContent = '🌙 Dark Mode';
            } else {
                document.body.classList.remove('light-mode');
                themeBtn.textContent = '☀️ Light Mode';
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            localStorage.setItem('tjp_theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
        }

        applySavedTheme();
    </script>
</body>
</html>
