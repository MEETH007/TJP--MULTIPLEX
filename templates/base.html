<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TJP Cinema — Premium Movie Experience{% endblock %}</title>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-hover: #e6b800;
            --bg-gradient: linear-gradient(135deg, #0a081a, #1a1638, #121026);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0b2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --radius-lg: 16px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient);
            color: var(--text-main); 
            min-height: 100vh;
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container { max-width: 1080px; margin: 0 auto; }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
        }
        .logo {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1.5px;
            text-decoration: none;
            display: inline-block;
        }
        .tagline {
            color: var(--text-muted);
            margin-top: 4px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }

        /* Buttons */
        .btn { 
            background: var(--primary);
            color: #000; 
            padding: 10px 22px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(255, 204, 0, 0.25);
        }
        .btn:hover { 
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
        }
        .btn:active { transform: translateY(0); }
        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 14px rgba(231, 76, 60, 0.3);
        }
        .btn-danger:hover { background: #c0392b; box-shadow: 0 6px 20px rgba(231, 76, 60, 0.5); }

        /* Card container */
        .card { 
            background: var(--card-bg); 
            padding: clamp(20px, 4vw, 32px); 
            border-radius: var(--radius-lg); 
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Flash messages */
        .flash { 
            background: rgba(231, 76, 60, 0.2); 
            color: #ff9999;
            border: 1px solid var(--danger);
            padding: 12px 20px; 
            border-radius: var(--radius-sm); 
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        /* Form Inputs */
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="password"] {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.2);
        }

        /* Seat grid styling */
        .seat { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            width: 30px; 
            height: 30px; 
            margin: 3px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 11px;
            font-weight: 700;
            transition: all 0.15s ease;
            user-select: none;
        }
        .available { background: var(--success); color: #fff; }
        .available:hover { transform: scale(1.15); background: #27ae60; }
        .booked { background: #4a4a5a; color: #888; cursor: not-allowed; opacity: 0.6; }
        .selected { 
            background: var(--primary) !important; 
            color: #000 !important; 
            transform: scale(1.15);
            box-shadow: 0 0 12px var(--primary);
        }
        .screen { 
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.02) 100%);
            border-top: 3px solid var(--primary);
            text-align: center; 
            padding: 10px; 
            margin: 20px auto 35px; 
            border-radius: 8px 8px 30px 30px;
            letter-spacing: 8px; 
            font-weight: 800; 
            font-size: 0.85rem;
            color: var(--text-muted);
            width: 75%;
            box-shadow: 0 15px 30px -10px rgba(255, 204, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="{{ url_for('index') }}" class="logo">🎬 TJP CINEMA</a>
            <p class="tagline">Next-Gen Cinema Reservation Portal</p>
        </header>

        <nav class="nav-bar">
            <a href="{{ url_for('index') }}" class="btn btn-outline">Home</a>
            <a href="{{ url_for('view_bookings') }}" class="btn btn-outline">Bookings Admin</a>
            <a href="{{ url_for('scan') }}" class="btn btn-outline">Gate Scanner</a>
            <a href="{{ url_for('admin_reset') }}" class="btn btn-outline" style="color: #ff9999;">Reset</a>
        </nav>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
