<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TJP Cinema — Premium Movie Experience{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.4);
            --bg-deep: #05070e;
            --surface-glass: rgba(18, 24, 38, 0.72);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(245, 158, 11, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(30, 58, 138, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 16px 40px;
        }

        .nav-wrapper {
            position: sticky;
            top: 16px;
            z-index: 1000;
            max-width: 1200px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .navbar {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .brand-block { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-icon { font-size: 1.55rem; filter: drop-shadow(0 0 12px var(--primary-glow)); }
        .brand-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            background: linear-gradient(135deg, #ffffff 40%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; align-items: center; gap: 10px; }
        .nav-pill {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 9px 18px;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }
        .nav-pill:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .nav-pill.primary {
            background: rgba(245, 158, 11, 0.12);
            color: var(--primary);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .nav-pill.primary:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .flash {
            max-width: 600px;
            margin: 0 auto 20px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .container { max-width: 1080px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="nav-wrapper">
        <header class="navbar">
            <a href="{{ url_for('index') }}" class="brand-block">
                <span class="brand-icon">🎬</span>
                <span class="brand-text">TJP CINEMA</span>
            </a>
            <nav class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-pill">Home</a>
                <a href="{{ url_for('scan_ticket') }}" class="nav-pill">Gate Scanner</a>
                <a href="{{ url_for('view_bookings') }}" class="nav-pill primary">Admin Portal &rarr;</a>
            </nav>
        </header>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
