{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 440px; margin: 40px auto; text-align: center;">
    <h2 style="color: var(--danger); margin-bottom: 8px;">Factory Reset</h2>
    <p style="color: #ff9999; font-size: 0.9rem; margin-bottom: 24px;">
        ⚠️ <strong>Warning:</strong> This permanently deletes all reservation records and resets every single seat to available.
    </p>

    <form method="POST" onsubmit="return confirmReset()">
        <input type="password" name="password" placeholder="Admin Passcode" required
               style="width: 100%; margin-bottom: 18px; text-align: center;">
        <button type="submit" class="btn btn-danger" style="width: 100%;">Authorize Database Wipe</button>
    </form>

    <div style="margin-top: 18px;">
        <a href="{{ url_for('index') }}" class="btn btn-outline" style="width: 100%;">Cancel & Return</a>
    </div>
</div>

<script>
    function confirmReset() {
        return confirm("Are you completely certain? This will delete all rows in Supabase bookings!");
    }
</script>
{% endblock %}
