{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Available Shows</h2>
    {% for i in range(shows|length) %}
        <div style="margin: 15px 0; padding: 15px; background:#222; border-radius:8px;">
            <strong>{{ shows[i].movie }}</strong> — {{ shows[i].time }}
            <br><br>
            <a href="{{ url_for('seats', show_id=i) }}" class="btn">Select Seats</a>
        </div>
    {% endfor %}
</div>
{% endblock %}
